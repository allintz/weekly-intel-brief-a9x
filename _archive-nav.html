<!-- ARCHIVE_NAV_START -->
<style>
#archive-nav-widget {
  position: fixed; top: 12px; right: 16px; z-index: 10000;
  font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 12px;
}
#archive-nav-widget button {
  background: #f6f2ea; color: #1c1a17;
  border: 1px solid #cfc8ba; padding: 6px 11px;
  border-radius: 2px; cursor: pointer; font-family: inherit;
  font-size: inherit; font-weight: 500; line-height: 1; letter-spacing: 0.02em;
}
#archive-nav-widget button:hover { border-color: #1c1a17; }
#archive-nav-widget.open .panel { display: block; }
#archive-nav-widget .panel {
  display: none; position: absolute; right: 0; top: 34px;
  background: #fbf9f4; border: 1px solid #cfc8ba; border-radius: 2px;
  padding: 4px; min-width: 220px; max-height: 60vh; overflow-y: auto;
  box-shadow: 0 8px 24px rgba(28,26,23,0.12);
}
#archive-nav-widget .panel a {
  display: block; padding: 7px 10px; color: #1c1a17; text-decoration: none;
  font-variant-numeric: tabular-nums; font-size: 12px; line-height: 1.3;
}
#archive-nav-widget .panel a:hover { background: #f0ebe1; }
#archive-nav-widget .panel a.current { color: #7a2f2b; font-weight: 600; }
#archive-nav-widget .panel a.self { background: #f0ebe1; }
#archive-nav-widget .panel .hint {
  padding: 8px 10px 6px; color: #8a847a; font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase;
  border-bottom: 1px solid #e4ded2; margin-bottom: 4px;
}
@media print { #archive-nav-widget { display: none; } }
</style>
<div id="archive-nav-widget" data-edition="__EDITION_DATE__">
  <button type="button" aria-label="Previous editions">Editions &#9662;</button>
  <div class="panel" role="menu">
    <div class="hint">Weekly Democracy Intelligence Brief</div>
    <div id="archive-nav-list">Loading&hellip;</div>
  </div>
</div>
<script>
(function() {
  var widget = document.getElementById('archive-nav-widget');
  var btn = widget.querySelector('button');
  var myEdition = widget.dataset.edition;
  btn.addEventListener('click', function(e) { e.stopPropagation(); widget.classList.toggle('open'); });
  document.addEventListener('click', function(e) { if (!widget.contains(e.target)) widget.classList.remove('open'); });
  fetch('/editions.json', { cache: 'no-cache' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var list = document.getElementById('archive-nav-list');
      list.innerHTML = '';
      if (!data.editions || !data.editions.length) { list.innerHTML = '<div class="hint">No editions yet</div>'; return; }
      data.editions.forEach(function(e, idx) {
        var a = document.createElement('a');
        a.href = idx === 0 ? '/' : '/archive/' + e.date;
        a.textContent = e.date + (idx === 0 ? '  (current)' : '');
        if (idx === 0) a.classList.add('current');
        if (e.date === myEdition) a.classList.add('self');
        list.appendChild(a);
      });
    })
    .catch(function() { document.getElementById('archive-nav-list').innerHTML = '<div class="hint">Archive unavailable</div>'; });
})();
</script>
<!-- ARCHIVE_NAV_END -->
